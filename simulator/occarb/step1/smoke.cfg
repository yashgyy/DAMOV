// OCCARB Step 1 smoke test: 1 simple core, small L2 so traffic reaches Ramulator DDR4.
sys = {
    frequency = 2400;
    lineSize = 64;
    cores = { c = { type = "Simple"; dcache = "l1d"; icache = "l1i"; }; };
    caches = {
        l1d = { size = 32768; };
        l1i = { size = 32768; };
        l2  = { caches = 1; size = 262144; children = "l1i|l1d"; };
    };
    mem = {
        type = "Ramulator";
        ramulatorConfig = "ramulator-configs/DDR4-config.cfg";
        latency = 1;
    };
};
sim = {
    stats = "smoke";
    phaseLength = 10000;
    maxTotalInstrs = 200000000L;
    pimMode = false;
};
// 4 MB buffer (> 256 kB L2) streamed repeatedly -> guaranteed DRAM traffic
process0 = { command = "dd if=/dev/zero of=/dev/null bs=4M count=100"; };
