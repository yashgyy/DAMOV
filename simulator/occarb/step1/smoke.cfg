// OCCARB Step 1 smoke test: 1 OOO core, Ramulator DDR4, STREAM Copy (1 thread).
// WORKLOADS_ROOT is substituted by run_check.sh.
sys = {
    lineSize = 64;
    frequency = 2400;
    cores = { core = { type = "OOO"; cores = 1; icache = "l1i"; dcache = "l1d"; }; };
    caches = {
        l1d = { caches = 1; size = 32768; array = { type = "SetAssoc"; ways = 8; }; latency = 4; };
        l1i = { caches = 1; size = 32768; array = { type = "SetAssoc"; ways = 4; }; latency = 3; };
        l2  = { caches = 1; size = 262144; array = { type = "SetAssoc"; ways = 8; };
                latency = 7; children = "l1i|l1d"; };
    };
    mem = {
        type = "Ramulator";
        ramulatorConfig = "ramulator-configs/DDR4-config.cfg";
        latency = 1;
    };
};
sim = {
    stats = "smoke";
    phaseLength = 1000;
    maxTotalInstrs = 20000000L;
    statsPhaseInterval = 1000;
    gmMBytes = 8192;
    pinOptions = "-ifeellucky";   // required: Pin 2.14 kernel-version check bypass
    deadlockDetection = false;
    pimMode = false;
};
process0 = {
    command = "WORKLOADS_ROOT/STREAM/stream_copy 1";
    startFastForwarded = True;
};
