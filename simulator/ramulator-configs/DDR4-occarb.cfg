########################
# OCCARB: Table II memory system
# DDR4-2400, 1 channel, 1 rank, 64-entry read/write queues
# (no inline comments allowed: Ramulator parser takes exactly 2 tokens per line)
########################
 standard = DDR4
 channels = 1
 ranks = 1
 speed = DDR4_2400R
 org = DDR4_8Gb_x8
 record_cmd_trace = off
 print_cmd_trace = off
 cpu_tick = 8
 mem_tick = 3
 early_exit = on
 expected_limit_insts = 200000000
 warmup_insts = 100000000
 cache = no
 translation = None
# OCCARB addition: controller read/write queue depth (default 32 if omitted)
 queue_size = 64
