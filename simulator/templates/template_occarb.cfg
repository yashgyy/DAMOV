// OCCARB system (paper Table II): 4x OOO x86-64, 32kB L1, 256kB L2, 8MB shared L3,
// Ramulator DDR4-2400, 1 channel, 64-entry queues.
// Placeholders: NUMBER_CORES, STATS_PATH, COMMAND_STRING, MAX_INSTRS, RAMULATOR_CONFIG
sys = {
    lineSize = 64;
    frequency = 2400;

    cores = {
        core = {
            type = "OOO";
            cores = NUMBER_CORES;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    caches = {
        l1d = {
            caches = NUMBER_CORES;
            size = 32768;
            array = { type = "SetAssoc"; ways = 8; };
            latency = 4;
        };
        l1i = {
            caches = NUMBER_CORES;
            size = 32768;
            array = { type = "SetAssoc"; ways = 4; };
            latency = 3;
        };
        l2 = {
            caches = NUMBER_CORES;
            size = 262144;
            latency = 7;
            array = { type = "SetAssoc"; ways = 8; };
            children = "l1i|l1d";
        };
        l3 = {
            type = "Timing";
            caches = 1;
            banks = 16;
            size = 8388608;
            latency = 27;
            array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
            children = "l2";
        };
    };

    mem = {
        type = "Ramulator";
        ramulatorConfig = "RAMULATOR_CONFIG";
        latency = 1;
        clockDivide = true;   // OCCARB: DRAM at its real clock (DDR4-2400 -> 1.2 GHz), see Step 5a
    };
};

sim = {
    pimMode = false;
    stats = "STATS_PATH";
    phaseLength = 1000;
    maxTotalInstrs = MAX_INSTRS;
    statsPhaseInterval = 1000;
    printHierarchy = true;
    gmMBytes = 8192;
    pinOptions = "-ifeellucky";
    deadlockDetection = false;
};

process0 = {
    command = "COMMAND_STRING";
    startFastForwarded = True;
};
