// Day 1 sparsity smoke test.
// Runs a small process that mmap's a large buffer, so we can verify
// the mmap hook fires and registerSparseRegion is called.

sys = {
    cores = {
        simpleCore = {
            type = "Simple";
            dcache = "l1d";
            icache = "l1i";
        };
    };

    lineSize = 64;

    caches = {
        l1d = { size = 65536; };
        l1i = { size = 32768; };
        l2 = {
            caches = 1;
            size = 2097152;
            children = "l1i|l1d";
        };
    };
};

sim = {
    phaseLength = 10000;
    schedQuantum = 50;

    // ---- Sparsity-aware NDP (Day 1) ----
    sparsity = {
        enabled = true;
        deltaEnabled = false;   // Day 4 will turn this on
        threshold = 0.001;
        minRegionKB = 64;       // low threshold so we catch even small allocations
    };
};

// A trivial workload that will do some mmap allocations.
// `dd` allocates a big buffer, so mmap fires.
process0 = {
    command = "dd if=/dev/zero of=/dev/null bs=1M count=4";
};
